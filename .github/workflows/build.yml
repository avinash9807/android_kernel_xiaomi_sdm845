name: Build Poco F1 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3
      with:
        ref: staging/lineage-17.1

    - name: Clone RTL8821CU Driver
      run: |
        git clone https://github.com/morrownr/8821cu-20210916.git drivers/net/wireless/realtek/rtl8821cu

    - name: Setup Toolchain & Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bison flex libncurses5-dev gcc-aarch64-linux-gnu

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make beryllium_defconfig
        make -j$(nproc)

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v3
      with:
        name: PocoF1-RTL8821CU-Image
        path: arch/arm64/boot/Image.gz-dtb
